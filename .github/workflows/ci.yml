jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: README.md and workflows are in sync (run `just write`)
        run: nix flake check path:.?dir=dev
name: ci
"on":
  - push
  - pull_request
