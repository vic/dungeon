jobs:
  c1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: test c1
        run: |-
          nix develop path:.?dir=dev -c just test c1 | tee out.txt || true
          grep '^TALLY' out.txt > tally-c1.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: tally-c1
          path: tally-c1.txt
  c2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: test c2
        run: |-
          nix develop path:.?dir=dev -c just test c2 | tee out.txt || true
          grep '^TALLY' out.txt > tally-c2.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: tally-c2
          path: tally-c2.txt
  c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: test c3
        run: |-
          nix develop path:.?dir=dev -c just test c3 | tee out.txt || true
          grep '^TALLY' out.txt > tally-c3.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: tally-c3
          path: tally-c3.txt
  c4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: test c4
        run: |-
          nix develop path:.?dir=dev -c just test c4 | tee out.txt || true
          grep '^TALLY' out.txt > tally-c4.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: tally-c4
          path: tally-c4.txt
  deadbugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: test deadbugs
        run: |-
          nix develop path:.?dir=dev -c just test deadbugs | tee out.txt || true
          grep '^TALLY' out.txt > tally-deadbugs.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: tally-deadbugs
          path: tally-deadbugs.txt
  progress:
    needs:
      - deadbugs
      - c1
      - c2
      - c3
      - c4
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/download-artifact@v4
        with:
          path: tallies
      - name: merge tallies
        run: nix develop path:.?dir=dev -c bash dev/merge-tally.sh tallies
      - name: regenerate README.md
        run: nix develop path:.?dir=dev -c just write
      - if: always()
        name: summary
        run: jq -r '.tests | to_entries[] | "| \(.key) | \(.value.pass)/\(.value.total) |"' dev/status.json >> "$GITHUB_STEP_SUMMARY"
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: commit progress (main only)
        run: |
          git diff --quiet dev/status.json README.md && exit 0
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "ci: update test progress" dev/status.json README.md
          git push
name: tests
"on":
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}
