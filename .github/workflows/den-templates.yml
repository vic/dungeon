jobs:
  entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - env:
          T: ${{ matrix.entry }}
        name: gate
        run: nix develop path:.?dir=dev -c just gate "$T"
    strategy:
      fail-fast: false
      matrix:
        entry:
          - minimal
          - bogus
          - noflake
          - flake-parts-modules
          - terranix-demo
          - nvf-standalone
          - default
          - example
          - microvm
          - fleet-demo
name: den-templates
"on":
  - push
  - pull_request
  - workflow_dispatch
