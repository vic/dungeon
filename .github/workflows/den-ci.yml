jobs:
  c1:
    continue-on-error: true
    if: contains(github.event.pull_request.labels.*.name, 'den-ci:c1') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix develop path:.?dir=dev -c just den-ci c1
  c2:
    continue-on-error: true
    if: contains(github.event.pull_request.labels.*.name, 'den-ci:c2') || github.event_name == 'workflow_dispatch'
