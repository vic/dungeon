jobs:
  deadbugs:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix develop path:.?dir=dev -c just deadbugs
name: deadbugs
"on":
  - push
  - pull_request
  - workflow_dispatch
